<div class="app-container">
  <div class="page-header">
    <div>
      <h1 class="gradient-text">Add New Product</h1>
      <p class="page-subtitle">Fill in the details to add a new product</p>
    </div>
    <button class="btn-back" (click)="goBack()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1rem; height: 1rem; margin-right: 0.5rem;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to Products
    </button>
  </div>

  <div *ngIf="error" class="alert error">{{ error }}</div>
  <div *ngIf="success" class="alert success">{{ success }}</div>

  <form (ngSubmit)="onSubmit()" class="product-form">
    <div class="form-group">
      <label>Product Name <span class="required">*</span></label>
      <input type="text" name="name" [(ngModel)]="product.name" required placeholder="Enter product name" class="input-field">
    </div>
    <div class="form-group">
      <label>Description <span class="required">*</span></label>
      <textarea name="description" [(ngModel)]="product.description" placeholder="Enter description" class="input-field" rows="4"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price (KSh) <span class="required">*</span></label>
        <input type="number" name="price" [(ngModel)]="product.price" required min="0" step="0.01" placeholder="0.00" class="input-field">
      </div>
      <div class="form-group">
        <label>Category <span class="required">*</span></label>
        <input type="text" name="category" [(ngModel)]="product.category" required placeholder="e.g. Electronics" class="input-field">
      </div>
    </div>
    <div class="form-group">
      <label>Stock Quantity <span class="required">*</span></label>
      <input type="number" name="stock" [(ngModel)]="product.stock" required min="0" placeholder="0" class="input-field">
    </div>

    <!-- Image Upload -->
    <div class="form-group">
      <label>Product Image</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" class="input-field">
      <button type="button" (click)="uploadImage()" [disabled]="!selectedFile || loading" class="btn-upload">
        {{ loading ? 'Uploading...' : 'Upload Image' }}
      </button>
      <div *ngIf="imagePreview" class="image-preview">
        <img [src]="imagePreview" alt="Preview">
      </div>
    </div>

    <button type="submit" [disabled]="loading" class="btn-submit">
      {{ loading ? 'Adding...' : 'Add Product' }}
    </button>
  </form>
</div>
