<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product App</title>
  <base href="/product-app/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root{--primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#818cf8;--primary-50:#eef2ff;--primary-100:#e0e7ff;--secondary:#8b5cf6;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;--shadow-sm:0 1px 2px 0 rgba(0,0,0,0.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);--shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05);--shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1),0 10px 10px -5px rgba(0,0,0,0.04);--gradient-primary:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);--gradient-subtle:linear-gradient(135deg,#eef2ff 0%,#faf5ff 100%)}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gradient-subtle);color:var(--gray-800);line-height:1.6}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer;transition:all 0.2s ease}
    input,select,textarea{font-family:inherit}
    .gradient-text{background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .app-container{max-width:1200px;margin:0 auto;padding:1.5rem}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
    .page-header h1{font-size:1.75rem;font-weight:700;color:var(--gray-900)}
    .page-subtitle{color:var(--gray-500);font-size:0.95rem}
    .category-filter{display:flex;gap:0.5rem;align-items:center}
    .category-filter label{font-size:0.9rem;font-weight:600;color:var(--gray-600)}
    .category-filter select{padding:0.5rem 0.875rem;border:1px solid var(--gray-300);border-radius:0.5rem;font-size:0.9rem;background:white}
    .alert{padding:0.875rem 1rem;border-radius:0.5rem;margin-bottom:1rem;border:1px solid;font-weight:500}
    .alert.error{background:#fef2f2;color:#991b1b;border-color:#fecaca}
    .alert.success{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem}
    .product-card{background:white;border-radius:0.75rem;box-shadow:var(--shadow-md);overflow:hidden;display:flex;flex-direction:column}
    .product-image{height:200px;overflow:hidden;position:relative;background:var(--gray-100)}
    .product-image img{width:100%;height:100%;object-fit:cover;display:block}
    .product-image .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--gray-400)}
    .product-info{padding:1rem;flex:1;display:flex;flex-direction:column}
    .product-info h3{font-size:1.1rem;font-weight:600;color:var(--gray-900);margin-bottom:0.5rem}
    .product-info p{font-size:0.9rem;color:var(--gray-600);margin-bottom:0.375rem}
    .product-info .product-price{font-size:1.1rem;font-weight:700;color:var(--primary);margin-bottom:0.5rem}
    .product-info .product-stock{font-size:0.85rem;color:var(--gray-500)}
    .product-info .product-category{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);margin-bottom:1rem}
    .order-section{display:flex;flex-direction:column;gap:0.5rem}
    .order-section label{font-size:0.85rem;font-weight:600;color:var(--gray-600)}
    .input-field{width:100%;padding:0.625rem 0.875rem;border:1px solid var(--gray-300);border-radius:0.5rem;font-size:0.9rem}
    .btn-primary{background:var(--gradient-primary);color:white;padding:0.625rem 1rem;border-radius:0.5rem;font-weight:600;border:none;box-shadow:var(--shadow-md);width:100%}
    .btn-primary:hover{box-shadow:var(--shadow-lg)}
    .btn-primary:disabled{opacity:0.6;cursor:not-allowed}
    .btn-cancel{background:#f3f4f6;color:var(--gray-700);padding:0.625rem 1rem;border-radius:0.5rem;border:1px solid var(--gray-300);font-weight:600;width:100%}
    .spinner{border:3px solid var(--gray-200);border-top:3px solid var(--primary);border-radius:50%;width:2rem;height:2rem;animation:spin 0.8s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem}
    .loading p{margin-top:1rem;color:var(--gray-500)}
    .empty-state{text-align:center;padding:3rem;color:var(--gray-500)}
  </style>
<link rel="stylesheet" href="styles.bac7b5fce97cc19132b2.css"></head>
<body>
  <app-root></app-root>
<script src="runtime.acf0dec4155e77772545.js" defer></script><script src="polyfills.5e0ce2c1a99c8658e3f9.js" defer></script><script src="main.9840d05ae53d7d81654d.js" defer></script></body>
</html>
